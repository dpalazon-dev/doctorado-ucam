name: Temporary architecture reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconcile-architecture.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile architecture documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')

          def patch(name, replacements):
              path = root / name
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'{name}: expected text not found: {old[:100]!r}')
                  text = text.replace(old, new)
              path.write_text(text)

          patch('DOCUMENTATION_ARCHITECTURE.md', [
              ('Level 3 — Functional and Vertical Specifications\n        ↓ drive\nLevel 4 — Navigation, Delivery and Process',
               'Level 3 — Functional, Vertical and Development Specifications\n        ↓ drive\nLevel 4 — Navigation, Delivery and Process'),
              ('''| `INTERACTION_MODEL.md` | Human-system collaboration, interaction channels, initiative and approval semantics. |

          A Level 2 document may be canonical within its declared scope. It may not override a Level 1 invariant.

          ## Level 3 — Functional and Vertical Specifications

          These documents define behavior, vocabulary and domain breadth.

          | Document | Specification responsibility |
          |---|---|
          | `SYSTEM_CAPABILITIES.md` | Stable vocabulary of what the system can do. |
          | `USE_CASES.md` | Canonical recurring intentions, flows, outcomes and state changes. |
          | `DOMAIN_VERTICALS.md` | Index and rules for specialization across operational verticals. |
          | `RESEARCH_VERTICAL.md` | Research-specific derived types and use-case mapping. |
          | `TEACHING_VERTICAL.md` | Teaching-specific derived types and use-case mapping. |
          | `ADMINISTRATION_VERTICAL.md` | Administration-specific derived types and use-case mapping. |
          | `ORGANIZATION_VERTICAL.md` | Organization-specific derived types and use-case mapping. |

          These documents drive implementation slices but do not define software modules, storage or runtime topology.''',
               '''| `INTERACTION_MODEL.md` | Human-system collaboration, interaction channels, initiative and approval semantics. |
          | `COMPONENT_MODEL.md` | Logical component decomposition, responsibility, state ownership, dependencies and runtime-role placement. |
          | `CANONICAL_DATA_MODEL.md` | Shared structural data contract and governed extension mechanism used by every vertical and physical schema. |
          | `DATA_ARCHITECTURE.md` | Logical data classes, ownership, lifecycle, projection, migration, backup and recovery requirements. |
          | `AGENT_RUNTIME.md` | Provider-neutral cognitive-operation lifecycle, verification, budgets, recovery and escalation semantics. |
          | `TECHNICAL_ARCHITECTURE.md` | Current concrete implementation languages, desktop topology, embedded persistence, packaging and operational baseline. |

          A Level 2 document may be canonical within its declared scope. It may not override a Level 1 invariant.

          ## Level 3 — Functional, Vertical and Development Specifications

          These documents define behavior, domain breadth and bounded implementation contracts.

          | Document | Specification responsibility |
          |---|---|
          | `SYSTEM_CAPABILITIES.md` | Stable vocabulary of what the system can do. |
          | `USE_CASES.md` | Canonical recurring intentions, flows, outcomes and state changes. |
          | `DOMAIN_VERTICALS.md` | Index and rules for specialization across operational verticals. |
          | `RESEARCH_VERTICAL.md` | Research-specific derived types and use-case mapping. |
          | `TEACHING_VERTICAL.md` | Teaching-specific derived types and use-case mapping. |
          | `ADMINISTRATION_VERTICAL.md` | Administration-specific derived types and use-case mapping. |
          | `ORGANIZATION_VERTICAL.md` | Organization-specific derived types and use-case mapping. |
          | `specs/**/*.md` | Bounded development contracts that translate upstream architecture into exact data, interface, runtime, test and delivery obligations. |

          Development Specs may be authoritative for the exact bounded implementation contract they declare. They may not override an upstream semantic, architectural or technical owner; a conflict must be resolved in that owner, and through an ADR when significant.'''),
              ('''| `IMPLEMENTATION_PLAN.md` | Proving experiments, acceptance criteria and falsification strategy. |
          | `CLAUDE.md` | Operating instructions for coding agents working in the repository. |
          | `DOCUMENTATION_ARCHITECTURE.md` | Documentation ownership, precedence and evolution. |
          | `IMPLEMENTATION_CONTEXTS.md` | Task-specific reading bundles for implementation agents. |''',
               '''| `IMPLEMENTATION_PLAN.md` | Proving experiments, acceptance criteria and falsification strategy. |
          | `DECISIONS.md` | Historical register of significant architectural decisions and supersession. |
          | `SPEC_CATALOG.md` | Registry, lifecycle, dependency order and current status of development Specs. |
          | `CLAUDE.md` | Operating instructions for coding agents working in the repository. |
          | `DOCUMENTATION_ARCHITECTURE.md` | Documentation ownership, precedence and evolution. |
          | `IMPLEMENTATION_CONTEXTS.md` | Task-specific reading bundles for implementation agents. |'''),
              ('''| Transaction, outbox, inbox and process semantics | `SOFTWARE_ARCHITECTURE.md` | Persistence and event runtime implementation |
          | Core Entity set and logical structure | `LOGICAL_DOMAIN_MODEL.md` | Domain modules, schemas, migrations |''',
               '''| Transaction, outbox, inbox and process semantics | `SOFTWARE_ARCHITECTURE.md` | Persistence and event runtime implementation |
          | Logical component decomposition and runtime-role placement | `COMPONENT_MODEL.md` | Source modules, composition and architecture tests |
          | Shared canonical record form and vertical extension mechanism | `CANONICAL_DATA_MODEL.md` | Database, API, UI schema and vertical Specs |
          | Logical data classes, ownership and lifecycle | `DATA_ARCHITECTURE.md` | Persistence, migration, projection and recovery Specs |
          | Cognitive-operation lifecycle, verification and budgets | `AGENT_RUNTIME.md` | Cognitive, tool, prompt and evaluation Specs |
          | Concrete languages, desktop topology, local storage and packaging | `TECHNICAL_ARCHITECTURE.md` | Build, runtime, database, IPC and release Specs |
          | Core Entity set and logical structure | `LOGICAL_DOMAIN_MODEL.md` | Domain modules, schemas, migrations |'''),
              ('''| Proving experiments and falsification criteria | `IMPLEMENTATION_PLAN.md` | Prototype work and evaluation |
          | Documentation governance | `DOCUMENTATION_ARCHITECTURE.md` | Every document |
          | Agent context bundles | `IMPLEMENTATION_CONTEXTS.md` | Coding-agent task preparation |''',
               '''| Proving experiments and falsification criteria | `IMPLEMENTATION_PLAN.md` | Prototype work and evaluation |
          | Architectural decision history and supersession | `DECISIONS.md` | Architecture reviews and downstream reconciliation |
          | Development Spec inventory, lifecycle and dependency order | `SPEC_CATALOG.md` | Spec authoring, implementation planning and milestone tracking |
          | Documentation governance | `DOCUMENTATION_ARCHITECTURE.md` | Every document |
          | Agent context bundles | `IMPLEMENTATION_CONTEXTS.md` | Coding-agent task preparation |'''),
              ('''1. Read `CLAUDE.md`.
          2. Check the current phase in `ROADMAP.md`.
          3. Select the matching bundle in `IMPLEMENTATION_CONTEXTS.md`.
          4. Load the authoritative owner documents in full.
          5. Load only the named sections of supporting documents.
          6. State the invariants it must preserve before changing code.
          7. Implement the smallest coherent slice.
          8. Validate code and documentation against the conformance rules in `SYSTEM_ARCHITECTURE.md` and `SOFTWARE_ARCHITECTURE.md`.''',
               '''1. Read `CLAUDE.md`.
          2. Check the current phase in `ROADMAP.md`.
          3. Check `SPEC_CATALOG.md` and identify the approved or active Spec governing the work.
          4. Select the matching bundle in `IMPLEMENTATION_CONTEXTS.md`.
          5. Load the active Spec and its authoritative owner documents in full.
          6. Load only the named sections of supporting documents.
          7. State the invariants it must preserve before changing code.
          8. Implement the smallest coherent slice inside the Spec boundary.
          9. Validate code and documentation against the Spec acceptance criteria and the conformance rules in `SYSTEM_ARCHITECTURE.md` and `SOFTWARE_ARCHITECTURE.md`.'''),
              ('''5. Functional specifications do not redefine domain structure.
          6. Vertical documents reference use cases instead of copying them.
          7. Required-reading sets are minimal and explicit.
          8. Downstream impact can be traced.
          9. `README.md`, `ROADMAP.md` and `CLAUDE.md` report the same project state.
          10. Coding tasks can be prepared through a bounded context bundle.
          11. Local links resolve.
          12. Repeated statements cannot override their authoritative owner.''',
               '''5. Functional, vertical and development specifications do not redefine upstream architecture or domain structure.
          6. Vertical documents reference use cases instead of copying them.
          7. Every development Spec is registered in `SPEC_CATALOG.md` and declares its upstream owners and dependencies.
          8. Required-reading sets are minimal and explicit.
          9. Downstream impact can be traced.
          10. `README.md`, `ROADMAP.md`, `SPEC_CATALOG.md` and `CLAUDE.md` report the same project state.
          11. Coding tasks can be prepared through a bounded context bundle and an approved Spec.
          12. Local links resolve.
          13. Repeated statements cannot override their authoritative owner.''')
          ])

          patch('SOFTWARE_ARCHITECTURE.md', [
              ('| **Downstream documents** | `IMPLEMENTATION_CONTEXTS.md`, future Technical Architecture, source topology, code, architecture tests and deployment design. |',
               '| **Downstream documents** | `COMPONENT_MODEL.md`, `CANONICAL_DATA_MODEL.md`, `DATA_ARCHITECTURE.md`, `AGENT_RUNTIME.md`, `TECHNICAL_ARCHITECTURE.md`, `SPEC_CATALOG.md`, development Specs, source topology, code and architecture tests. |'),
              ('- the evolution path from a personal deployment to a physically distributed system.',
               '- the evolution path from the local-first desktop baseline to selective physical isolation only when evidence requires it.'),
              ('''SOFTWARE_ARCHITECTURE.md
          modules, contracts, runtimes and mechanisms
                      ↓
          TECHNICAL_ARCHITECTURE.md
          concrete technologies and deployment topology
                      ↓
          Implementation
          source code, schemas, configuration and operations''',
               '''SOFTWARE_ARCHITECTURE.md
          modules, contracts, runtimes and mechanisms
                      ↓
          COMPONENT_MODEL.md · CANONICAL_DATA_MODEL.md
          DATA_ARCHITECTURE.md · AGENT_RUNTIME.md
          bounded implementation models
                      ↓
          TECHNICAL_ARCHITECTURE.md
          concrete local-first technologies and process topology
                      ↓
          SPEC_CATALOG.md · development Specs
          exact bounded implementation contracts
                      ↓
          Implementation
          source code, schemas, configuration, packaging and operations'''),
              ('''Those definitions remain owned by their canonical documents.

          ---

          # Normative Language''',
               '''Those definitions remain owned by their canonical documents.

          ## Current technical realization

          The current `TECHNICAL_ARCHITECTURE.md` realizes this architecture as one installed desktop product with an authoritative Tauri/Rust host and one subordinate Python cognitive sidecar. This is a downstream placement decision, not a change to logical module ownership.

          - Rust hosts canonical persistence, application and domain authority, durable execution, security and process supervision.
          - Python hosts bounded cognitive and scientific capability adapters.
          - Interactive, background, scheduler and maintenance remain **runtime roles**; they do not imply four services or four independently authoritative processes.
          - A component remains governed by this document and `COMPONENT_MODEL.md` regardless of which of the two baseline processes executes it.

          ---

          # Normative Language'''),
              ('''└── bootstrap/
              ├── interactive_runtime/
              ├── worker_runtime/
              ├── scheduler_runtime/
              └── maintenance_runtime/''',
               '''└── bootstrap/
              ├── interactive_role/
              ├── background_role/
              ├── scheduler_role/
              └── maintenance_role/'''),
              ('''# Deployment Evolution

          Physical architecture evolves in stages.

          ## Stage 0 — In-process validation

          - one executable may host interactive and background roles;
          - adapters may be local;
          - events may be dispatched in-process after transactional persistence;
          - architecture boundaries remain enforced in modules and tests.

          Purpose: falsify domain and workflow assumptions with minimal operational complexity.

          ## Stage 1 — Separated worker roles

          - interactive and worker runtimes execute separately;
          - durable job and event delivery are required;
          - shared canonical state remains authoritative;
          - isolated execution is introduced for risky tools.

          Purpose: support long-running work and independent recovery.

          ## Stage 2 — Selective physical isolation''',
               '''# Deployment Evolution

          Physical architecture evolves only when measured requirements justify additional boundaries.

          ## Stage 0 — Local desktop baseline

          - one installed product hosts the Workspace and authoritative application runtime;
          - one subordinate cognitive sidecar provides the specialized Python execution environment;
          - interactive, background, scheduler and maintenance concerns remain runtime roles inside that product;
          - jobs and events are durable even when delivery executes locally;
          - adapters and canonical storage are local by default;
          - risky tools may use ephemeral isolated processes without gaining authority;
          - architecture boundaries remain enforced in modules, IPC contracts and tests.

          Purpose: validate the complete product topology and proving slice with minimal operational complexity.

          ## Stage 1 — Additional local process isolation

          - a runtime role may move to another supervised local process only for failure containment, resource control or sandboxing;
          - canonical state remains owned by the authoritative host;
          - durable job and event protocols remain unchanged;
          - process extraction does not create a new service owner or direct database writer.

          Purpose: contain expensive or risky local work without introducing a distributed platform.

          ## Stage 2 — Selective physical isolation'''),
              ('''# Deferred Technical Decisions

          The following remain for `TECHNICAL_ARCHITECTURE.md` or dedicated ADRs.''',
               '''# Technical Decisions Owned Downstream

          The following concerns are selected provisionally by `TECHNICAL_ARCHITECTURE.md` and significant choices are recorded in `DECISIONS.md`. They remain downstream of this implementation-neutral architecture and may change through evidence without rewriting its contracts.'''),
              ('''| `LOGICAL_DOMAIN_MODEL.md` | attributes, invariants, relationships, lifecycles and aggregate roots |
          | `KNOWLEDGE_MODEL.md` | Knowledge proposal, validation, provenance and lifecycle enforcement |''',
               '''| `LOGICAL_DOMAIN_MODEL.md` | attributes, invariants, relationships, lifecycles and aggregate roots |
          | `COMPONENT_MODEL.md` | logical component decomposition, state ownership and runtime-role placement |
          | `CANONICAL_DATA_MODEL.md` | structural record contracts and vertical extension mechanism |
          | `DATA_ARCHITECTURE.md` | logical data classes, lifecycle, migration and projection obligations |
          | `AGENT_RUNTIME.md` | cognitive execution semantics, verification, budgets and recovery |
          | `TECHNICAL_ARCHITECTURE.md` | current languages, desktop topology, embedded storage and packaging baseline |
          | `SPEC_CATALOG.md` | bounded development-spec inventory, dependency order and delivery state |
          | `KNOWLEDGE_MODEL.md` | Knowledge proposal, validation, provenance and lifecycle enforcement |''')
          ])

          patch('DATA_ARCHITECTURE.md', [
              ('''| **Required reading** | `SYSTEM_ARCHITECTURE.md`, `LOGICAL_DOMAIN_MODEL.md`, `SOFTWARE_ARCHITECTURE.md`, `COMPONENT_MODEL.md`, `MEMORY_MODEL.md`, `CONTEXT_MODEL.md`, `EVENT_MODEL.md`, `DECISIONS.md`. |
          | **Downstream documents** | `AGENT_RUNTIME.md`, `TECHNICAL_ARCHITECTURE.md`, database specifications, schemas, migrations, repository adapters, projection specifications, retention policies and backup runbooks. |''',
               '''| **Required reading** | `SYSTEM_ARCHITECTURE.md`, `LOGICAL_DOMAIN_MODEL.md`, `SOFTWARE_ARCHITECTURE.md`, `COMPONENT_MODEL.md`, `CANONICAL_DATA_MODEL.md`, `MEMORY_MODEL.md`, `CONTEXT_MODEL.md`, `EVENT_MODEL.md`, `DECISIONS.md`. |
          | **Downstream documents** | `AGENT_RUNTIME.md`, `TECHNICAL_ARCHITECTURE.md`, `SPEC_CATALOG.md`, database and vertical Specs, schemas, migrations, repository adapters, projection specifications, retention policies and backup runbooks. |'''),
              ('''Logical Domain Model
                  ↓ defines canonical entities and invariants
          Software Architecture
                  ↓ defines transactions, ports and projections
          Component Model
                  ↓ assigns component ownership
          Data Architecture
                  ↓ defines logical records and data lifecycles
          Technical Architecture
                  ↓ maps them to concrete products and schemas
          Area Specifications
                  ↓ define exact fields, indexes and migrations''',
               '''Logical Domain Model
                  ↓ defines canonical entities and invariants
          Canonical Data Model
                  ↓ defines shared record form and extension contracts
          Software Architecture
                  ↓ defines transactions, ports and projections
          Component Model
                  ↓ assigns component ownership
          Data Architecture
                  ↓ defines logical record families, ownership and lifecycles
          Technical Architecture
                  ↓ maps them to embedded local products and process boundaries
          Development and Vertical Specs
                  ↓ define exact schemas, indexes, migrations and acceptance tests''')
          ])

          patch('COMPONENT_MODEL.md', [
              ('''| **Required reading** | `SYSTEM_PRINCIPLES.md`, `SYSTEM_ARCHITECTURE.md`, `SOFTWARE_ARCHITECTURE.md`, `LOGICAL_DOMAIN_MODEL.md`, `DECISIONS.md` (ADR-0001 through ADR-0006). |
          | **Downstream documents** | `DATA_ARCHITECTURE.md`, `AGENT_RUNTIME.md`, `TECHNICAL_ARCHITECTURE.md`, area specifications, source-tree design, architecture tests and deployment manifests. |''',
               '''| **Required reading** | `SYSTEM_PRINCIPLES.md`, `SYSTEM_ARCHITECTURE.md`, `SOFTWARE_ARCHITECTURE.md`, `LOGICAL_DOMAIN_MODEL.md`, `DECISIONS.md` (ADR-0001 through ADR-0011). |
          | **Downstream documents** | `CANONICAL_DATA_MODEL.md`, `DATA_ARCHITECTURE.md`, `AGENT_RUNTIME.md`, `TECHNICAL_ARCHITECTURE.md`, `SPEC_CATALOG.md`, foundation and area Specs, source-tree design, architecture tests and packaging manifests. |'''),
              ('''This table permits placement. `TECHNICAL_ARCHITECTURE.md` decides the actual deployment topology.

          ---

          # State Ownership Matrix''',
               '''This table permits placement. `TECHNICAL_ARCHITECTURE.md` decides the actual deployment topology.

          ## Current baseline mapping

          Under ADR-0007 through ADR-0010, the baseline maps these logical roles into two supervised product processes:

          - the **authoritative Tauri/Rust host** executes Experience integration, Application, Domain, Process/Event, Operations and canonical Platform Adapter responsibilities;
          - the **subordinate Python cognitive sidecar** executes bounded Cognitive capabilities and selected document-processing adapters through versioned IPC;
          - risky tools may execute in ephemeral isolated subprocesses, but cannot own canonical state or bypass the Rust application boundary;
          - Background, Scheduler/Dispatcher and Maintenance columns remain roles, not mandatory standalone services.

          This mapping is provisional and replaceable downstream. It does not change component state ownership or allowed dependencies.

          ---

          # State Ownership Matrix''')
          ])

          patch('AGENT_RUNTIME.md', [
              ('| **Downstream documents** | `TECHNICAL_ARCHITECTURE.md`, cognitive-operation specifications, capability/tool specifications, prompt and policy specifications, evaluation suites, runtime code and operational runbooks. |',
               '| **Downstream documents** | `TECHNICAL_ARCHITECTURE.md`, `SPEC_CATALOG.md`, cognitive-operation Specs, capability/tool Specs, prompt and policy Specs, evaluation suites, runtime code and operational runbooks. |'),
              ('''Technical Architecture
                  ↓ selects frameworks, models, queues and sandboxes
          Operation Specifications
                  ↓ define task-specific prompts, tools and acceptance tests''',
               '''Technical Architecture
                  ↓ maps authority, cognition, IPC, model adapters and isolation to the local desktop runtime
          Development Specifications
                  ↓ define task-specific contracts, prompts, tools and acceptance tests'''),
              ('''If it conflicts with `SOFTWARE_ARCHITECTURE.md` about commands, proposals, transactions or effects, Software Architecture owns the rule.

          ---

          # Runtime Thesis''',
               '''If it conflicts with `SOFTWARE_ARCHITECTURE.md` about commands, proposals, transactions or effects, Software Architecture owns the rule.

          ## Current process realization

          ADR-0009 and `TECHNICAL_ARCHITECTURE.md` split this logical runtime across two supervised processes without splitting authority:

          - the authoritative Rust host owns admission, policy checks, budgets, durable scheduling, checkpoints, cancellation, tool authorization and commitment of accepted Proposals;
          - the Python sidecar executes bounded cognitive and scientific steps and returns typed observations, Artifacts and Proposals;
          - a model response, Python process or agent framework never becomes a second execution authority or canonical state owner;
          - IPC failure is handled as a recoverable capability failure under the lifecycle defined here.

          This section adopts the technical placement decision. The lifecycle and verification semantics remain provider- and language-neutral.

          ---

          # Runtime Thesis''')
          ])

          patch('IMPLEMENTATION_CONTEXTS.md', [
              ('''| **Required reading** | `DOCUMENTATION_ARCHITECTURE.md`, `CLAUDE.md`, `ROADMAP.md` |
          | **Downstream documents** | Coding-agent prompts, implementation plans, pull requests and future development workflows. |''',
               '''| **Required reading** | `DOCUMENTATION_ARCHITECTURE.md`, `CLAUDE.md`, `ROADMAP.md`, `SPEC_CATALOG.md` |
          | **Downstream documents** | Development Specs, coding-agent prompts, implementation plans, pull requests and automated development workflows. |'''),
              ('''1. Read `CLAUDE.md`.
          2. Check `ROADMAP.md` for the current phase.
          3. Select exactly one primary bundle below.
          4. Add secondary bundles only when the task genuinely crosses boundaries.
          5. Read the relevant accepted or proposed ADRs in `DECISIONS.md`; do not treat them as substitutes for canonical owners.
          6. Read authoritative documents in full.
          7. Read supporting documents only at the sections named by the task.
          8. Write down the invariants and owned concerns before implementation.
          9. Identify downstream documentation impact.
          10. Implement and test the smallest coherent change.
          11. Report conformance, open questions and any required ADR.''',
               '''1. Read `CLAUDE.md`.
          2. Check `ROADMAP.md` for the current phase.
          3. Check `SPEC_CATALOG.md` and identify the governing Spec, status and prerequisites.
          4. Select exactly one primary bundle below.
          5. Add secondary bundles only when the task genuinely crosses boundaries.
          6. Read the governing Spec and the relevant ADRs in `DECISIONS.md`; ADRs do not replace canonical owners.
          7. Read authoritative documents in full.
          8. Read supporting documents only at the sections named by the task.
          9. Write down the invariants, authority boundary and owned state before implementation.
          10. Identify downstream documentation impact.
          11. Implement and test the smallest coherent change inside the Spec boundary.
          12. Report conformance, open questions, deferrals and any required ADR.'''),
              ('''# Bundle 16 — Technical Architecture or Deployment

          Use only after the roadmap authorizes concrete technology selection.

          ## Load in full

          - `SYSTEM_ARCHITECTURE.md`
          - `SOFTWARE_ARCHITECTURE.md`
          - `ROADMAP.md`
          - relevant ADRs when present.''',
               '''# Bundle 16 — Technical Architecture, Packaging or Deployment

          Use when changing the current local-first technical baseline, process topology, packaging, installation or release mechanisms. Ordinary implementation of an existing choice belongs under Bundle 19.

          ## Load in full

          - `SYSTEM_ARCHITECTURE.md`
          - `SOFTWARE_ARCHITECTURE.md`
          - `TECHNICAL_ARCHITECTURE.md`
          - `ROADMAP.md`
          - `SPEC_CATALOG.md`
          - relevant accepted ADRs.'''),
              ('''## Preserve

          - technology choices remain adapters to architectural ports;
          - the proving slice informs choices;
          - operational simplicity is preferred until evidence demands distribution;
          - every selected product has an exit boundary.''',
               '''## Preserve

          - local-first, single-user desktop operation;
          - Tauri/React presentation and the authoritative Rust boundary;
          - Python as a subordinate cognitive sidecar with no canonical write authority;
          - embedded local persistence and rebuildable projections;
          - technology choices remain adapters to architectural ports;
          - the proving slice informs stabilization or replacement;
          - operational simplicity is preferred until evidence demands distribution;
          - every selected product has an exit boundary.'''),
              ('''## Load in full

          - `COMPONENT_MODEL.md` section for the owning component;
          - the relevant owner among `DATA_ARCHITECTURE.md`, `AGENT_RUNTIME.md` or `TECHNICAL_ARCHITECTURE.md`;
          - relevant command/query/process sections of `SOFTWARE_ARCHITECTURE.md`;
          - the selected use case or experiment acceptance criteria.''',
               '''## Load in full

          - `SPEC_CATALOG.md`;
          - `CANONICAL_DATA_MODEL.md` when persistent or vertical data is involved;
          - `COMPONENT_MODEL.md` section for the owning component;
          - the relevant owner among `DATA_ARCHITECTURE.md`, `AGENT_RUNTIME.md` or `TECHNICAL_ARCHITECTURE.md`;
          - relevant command/query/process sections of `SOFTWARE_ARCHITECTURE.md`;
          - the selected use case or experiment acceptance criteria.'''),
              ('8. API/UI or worker contracts.', '8. Workspace, IPC, runtime-role or external-interface contracts.'),
              ('''## Expected output

          A standalone specification that a coding agent can implement without loading the entire repository or inventing architectural decisions.

          # Combining Bundles''',
               '''## Expected output

          A standalone specification that a coding agent can implement without loading the entire repository or inventing architectural decisions.

          ---

          # Bundle 19 — Implement an Approved Development Spec

          Use for production implementation after a Spec has reached `Approved` or `Implementing` in `SPEC_CATALOG.md`.

          ## Load in full

          - the governing Spec;
          - its entry in `SPEC_CATALOG.md`;
          - every canonical owner named by the Spec;
          - the source modules and tests being changed.

          ## Load selectively

          - dependency Specs whose public contracts are consumed;
          - ADRs explicitly referenced by the Spec;
          - experiment fixtures or acceptance datasets;
          - packaging sections when the change affects distribution.

          ## Exclude by default

          - unrelated future Specs;
          - alternative technologies already rejected or deferred;
          - vertical models outside the Spec scope;
          - speculative capabilities not required by acceptance criteria.

          ## Preserve

          - implementation remains inside the approved scope and non-goals;
          - dependency direction and state ownership;
          - Rust authority and Python sidecar limits;
          - exact schema and IPC versions;
          - idempotency, recovery and audit obligations;
          - every acceptance criterion has executable evidence.

          ## Required completion report

          - Spec and implemented tasks;
          - files and contracts changed;
          - migrations or compatibility impact;
          - tests and acceptance evidence;
          - unresolved deferrals;
          - whether the Spec may advance to `Implemented` or `Validated`.

          # Combining Bundles''')
          ])

          patch('IMPLEMENTATION_PLAN.md', [
              ('| **Downstream documents** | Prototype tasks, experiment reports, ADRs and Technical Architecture evidence. |',
               '| **Downstream documents** | `SPEC_CATALOG.md`, proving-slice Specs, prototype tasks, experiment reports, ADRs and Technical Architecture stabilization evidence. |'),
              ('> **Status: Living · Phase B · first pass.** This is **not** a development roadmap.',
               '> **Status: Living · proving plan · first pass.** This is **not** a development roadmap.'),
              ('Their broader assumption catalogue, the decisions they feed (ADRs), and any technology selection are named here only as *deferred*.',
               'Their broader assumption catalogue and the decisions they may confirm, revise or supersede are named here only as experiment consequences. Current technology selections are imported from `TECHNICAL_ARCHITECTURE.md` and remain provisional until evidence stabilizes them.'),
              ('Everything below is a servant of the domain, and each is swappable. The domain is truth; each mechanism is a projection. Concrete products are chosen later, in the Technical Architecture — this map fixes only *roles*, not technologies.',
               'Everything below is a servant of the domain, and each is swappable. The domain is truth; each mechanism is a projection. `TECHNICAL_ARCHITECTURE.md` now supplies the current reversible product choices; this map continues to fix only roles and therefore remains valid when an adapter is replaced.'),
              ('When Experiment 0 holds and the three that follow have been demonstrated — or falsified informatively — we can either build on a validated foundation or revise the model *before* committing to a technology stack. That is the point of doing this now, before committing to the Technical Architecture and production implementation: to make the expensive decisions on evidence rather than on the elegance of the design.',
               'When Experiment 0 holds and the three that follow have been demonstrated — or falsified informatively — we can either stabilize the current provisional baseline or revise the model and adapters before expanding the product. The point is to make expensive stabilization and scaling decisions on evidence rather than on the elegance of the design.'),
              ('Concretely, this realizes the ROADMAP\'s **M6 · Proving slice**, reframed from "a feature running end-to-end" to "the architecture\'s core claims, tested."',
               'Concretely, this provides the falsification programme for the ROADMAP\'s **M12 · Proving slice**, reframed from "a feature running end-to-end" to "the architecture\'s core claims, tested."'),
              ('- **Technology and dependencies** — LLM providers, the concrete stores behind each row of the mechanism map, academic-metadata sources, ingestion tooling. These belong to the Technical Architecture and its ADRs. The Software Architecture defines their required contracts without selecting products.',
               '- **Technology replacement evidence** — measurements that would justify replacing the current embedded stores, model adapters, ingestion tools or process boundaries. Initial choices belong to `TECHNICAL_ARCHITECTURE.md` and ADR-0007 through ADR-0010; experiments may trigger later ADRs but do not silently rewrite them.')
          ])

          patch('AI_ARCHITECTURE.md', [
