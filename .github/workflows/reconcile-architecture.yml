          PY

      - name: Validate documentation consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          docs = list(root.glob('*.md'))
          missing_contract = [p.name for p in docs if '## Document Contract' not in p.read_text()]
          if missing_contract:
              raise SystemExit(f'Missing Document Contract: {missing_contract}')
          broken = []
          for p in docs:
              text = p.read_text()
              if text.count('```') % 2:
                  raise SystemExit(f'Unbalanced code fences: {p.name}')
              for match in re.finditer(r'\[[^\]]+\]\(([^)]+\.md)(?:#[^)]+)?\)', text):
                  target = match.group(1)
                  if not (p.parent / target).exists():
                      broken.append((p.name, target))
          if broken:
              raise SystemExit(f'Broken Markdown links: {broken}')
          stale = [
              'future Technical Architecture',
              'before committing to the Technical Architecture',
              'M6 · Proving slice'
          ]
          hits = []
          for p in docs:
              text = p.read_text()
              for term in stale:
                  if term in text:
                      hits.append((p.name, term))
          if hits:
              raise SystemExit(f'Stale architecture references: {hits}')
          print(f'Validated {len(docs)} root Markdown documents')
          PY

