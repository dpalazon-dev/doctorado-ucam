        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-architecture.yml
          git add DOCUMENTATION_ARCHITECTURE.md SOFTWARE_ARCHITECTURE.md DATA_ARCHITECTURE.md COMPONENT_MODEL.md AGENT_RUNTIME.md IMPLEMENTATION_CONTEXTS.md IMPLEMENTATION_PLAN.md AI_ARCHITECTURE.md CONTEXT_MODEL.md SYSTEM_ARCHITECTURE.md
          git commit -m "Reconcile architecture documentation with specification phase"
          git push
