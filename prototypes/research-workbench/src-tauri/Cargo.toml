[package]
name = "research-workbench"
version = "0.0.1"
edition = "2024"
default-run = "research-workbench"
rust-version = "1.90"
[lib]
name = "research_workbench_core"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tempfile = "3"
pdf = { version = "=0.10.0", default-features = false }
[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
